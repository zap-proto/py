name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# PyPI trusted publishing (OIDC) — no stored token, KMS/secret-free.
# Requires a one-time trusted-publisher entry on pypi.org for
# project "zap-proto", repo zap-proto/py, workflow release.yml, env pypi.
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
