[project]
name = "zap-proto"
version = "1.4.1"
description = "ZAP - Zero-Copy App Proto for Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ZAP Protocol", email = "dev@zap-proto.dev" }]
requires-python = ">=3.10"
keywords = ["zap", "rpc", "agents", "mcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # The core — the zero-copy wire codec (`zap.wire`), the router envelope
    # (`zap.frame` + ZapClient), the JSON framing (`zap.protocol`), the RPC
    # client/server (`zap.rpc`), identity, and consensus — is PURE STDLIB.
    # No third-party dependency is on the import path of `import zap`.
]

[project.optional-dependencies]
# Real post-quantum crypto: ML-KEM-768 / ML-DSA-65 (pqcrypto) + X25519.
crypto = [
    "pqcrypto>=0.4,<1",
    "cryptography>=42,<50",
]
# The FastMCP-style decorator app builds JSON Schemas from function signatures.
app = [
    "pydantic>=2.0,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pqcrypto>=0.4,<1",
    "cryptography>=42,<50",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://zap-proto.io"
Repository = "https://github.com/zap-proto/py"
Documentation = "https://zap-proto.dev/docs/sdks/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zap"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/zap"]
